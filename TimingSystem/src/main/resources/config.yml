settings:
   triton:
      # Automatically detect Triton plugin and use Triton locale for multilingual support
      autodetect: true
      # Force enable Triton locale even if Triton plugin is not detected
      enabled: false
frosthexaddon:
   enabled: false
medalsaddon:
   enabled: false
   showNextMedal: true
   showEveryone: true
   playersLimit: 500
   netheritePos: 3
   emeraldPos: 10
   diamondPos: 0.05
   goldPos: 0.1
   silverPos: 0.25
   copperPos: 0.5
   dynamicDiamondPos:
      enabled: false
      cap: 0.075
      0to499:
         min: 0
         max: 499
         A: 1.208
         p: 0.563
      500to999:
         min: 500
         max: 999
         A: 1.055
         p: 0.585
      1Kto10K:
         min: 1000
         max: 9999
         A: 0.435
         p: 0.713
      10Kto100K:
         min: 10000
         max: 99999
         A: 2.751
         p: 0.513
      100Kto1M:
         min: 100000
         max: 999999
         A: 4.296
         p: 0.474
leaderboards:
   updateticks: 18000
   fastesttime:
      lines:
         - '§6§l✦ §e§l{mapname} §6§l✦'
         - '§e§l1. §f{name1} §8- §a{time1}'
         - '§e§l2. §f{name2} §8- §a{time2}'
         - '§e§l3. §f{name3} §8- §a{time3}'
         - '§7§l4. §f{name4} §8- §a{time4}'
         - '§7§l5. §f{name5} §8- §a{time5}'
         - '§7§l6. §f{name6} §8- §a{time6}'
         - '§7§l7. §f{name7} §8- §a{time7}'
         - '§7§l8. §f{name8} §8- §a{time8}'
         - '§7§l9. §f{name9} §8- §a{time9}'
         - '§7§l10. §f{name10} §8- §a{time10}'
tracks:
   timesPageSize: 18
finals:
   laps: 5
   pits: 2
   startDelay: 50
qualifying:
   timeLimit: 60s
   startDelay: 2s
scoreboard:
   maxRows: 15
   interval: 1s
drs:
   minDelta: 650
   maxDelta: 1150
   duration: 2000
   forwardAccel: 0.06
spawn:
   # Enable spawn system: teleport players to spawn on join/respawn and give hotbar items
   enabled: false
   # World name for the spawn location
   world: "world"
   # Spawn coordinates
   x: -33
   y: 100
   z: 1798
   yaw: 0
   pitch: 0
realistic:
   # Server name displayed to clients with the realistic mod
   serverName: "Realistic Rally Server"
   # Supported features (sent to clients for compatibility negotiation)
   features:
      fourWheel: true
      weather: true
      economy: false
      soloRace: true
      customCars: false
      multiplayerRace: false
   # Ghost / Line system: replay of personal best during races
   ghost:
      enabled: true
      # Maximum ghost length in ticks (20 tps × 60s × 20min = 24000)
      max_ghost_ticks: 24000
      # Storage directory under plugin data folder
      storage_directory: "ghosts"
      # Chunk size for ghost data transfer (bytes)
      chunk_size_bytes: 16384
race:
   # Enable the race system (solo + multiplayer)
   enabled: true
   # Maximum concurrent solo race sessions
   max_concurrent: 20
   # Countdown length in seconds before race start
   countdown_seconds: 5
   # Auto-cancel timeout for solo races in minutes
   timeout_minutes: 10
   # Enable difficulty selection GUI after picking a track
   # When enabled, players choose difficulty (1-5 stars) before starting a race.
   # Higher difficulty increases rewards but applies restrictions (e.g., no custom parts).
   difficulty_selection_enabled: false
   # Rewards for completing a race
   rewards:
      coins: 30
      xp: 40
   # False start detection settings
   false_start:
      # Enable false start detection during countdown
      enabled: true
   # Time control settings (rally-style timing checkpoints)
   time_control:
      # Enable time control regions
      enabled: true
      # Time window in seconds (target ± window)
      window_seconds: 60
      # Penalty per minute of late arrival (seconds)
      late_penalty_seconds: 10
      # Penalty per minute of early arrival (seconds)
      early_penalty_seconds: 60
   # Recce (reconnaissance) mode settings
   recce:
      enabled: true
      speed_multiplier: 0.5
   # Service park settings (rally-style repair/maintenance stop)
   service_park:
      # Enable service park regions
      enabled: true
      # Time limit for service park visits in seconds
      time_limit_seconds: 30
   # Multi-stage rally settings
   rally:
      enabled: true
      super_rally_penalty_minutes: 5
# Dynamic weather settings for tracks with dynamicWeather enabled
dynamic_weather:
   # How often weather changes (in minutes)
   change_interval_minutes: 5
economy:
   # Enable Rally Coins economy system
   enabled: true
   # Coin rewards for various activities
   coins:
      track_complete: 20
      first_completion_multiplier: 3
      personal_record_bonus: 25
      leaderboard_top1: 100
      leaderboard_top2: 50
      leaderboard_top3: 25
      event_participation: 30
levels:
   # Enable the level/XP progression system
   enabled: true
   max_level: 100
   xp_formula_base: 100
   xp_formula_growth: 0.1
   show_in_xp_bar: true
   rewards:
      track_complete: 20
      personal_record: 30
      event_participation: 50
      event_win: 100
   unlock_levels:
      classic_rally: 5
      wrc_car: 10
      group_b: 15
      truck: 20
      tire_customization: 25
      engine_customization: 30
      body_customization: 40
