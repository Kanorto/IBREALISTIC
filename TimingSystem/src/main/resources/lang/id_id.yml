Description: >
  Special formatting codes:
    &1 = primary color
    &2 = secondary color
    &e = error color
    &s = success color
    &w = warning color
    &b = broadcast color
    &a = award color
    &c = award secondary color
    &t = title color
    &l = bold decoration
    &o = italic decoration
    &r = reset decoration and color
    %example% = Placeholder, do not touch.

