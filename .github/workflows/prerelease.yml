name: Pre-release on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  prerelease:
    name: Build and Pre-release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Determine pre-release version
        id: version
        run: |
          # Read realistic_version from gradle.properties
          REALISTIC_VERSION=$(grep '^realistic_version=' OpenBoatUtilsRealistic/gradle.properties | cut -d'=' -f2)
          echo "realistic_version=$REALISTIC_VERSION" >> "$GITHUB_OUTPUT"

          # Find the latest pre-release tag for this version (e.g. v1.0.5.3)
          LATEST_PRERELEASE=$(git tag -l "v${REALISTIC_VERSION}.*" --sort=-version:refname | head -n 1)

          if [ -z "$LATEST_PRERELEASE" ]; then
            # No pre-release tags yet, start from .1
            NEXT_BUILD=1
          else
            # Extract the build number (4th segment) and increment
            ESCAPED_VERSION=$(echo "$REALISTIC_VERSION" | sed 's/\./\\./g')
            CURRENT_BUILD=$(echo "$LATEST_PRERELEASE" | sed "s/v${ESCAPED_VERSION}\.\([0-9]*\)/\1/")
            NEXT_BUILD=$((CURRENT_BUILD + 1))
          fi

          PRERELEASE_TAG="v${REALISTIC_VERSION}.${NEXT_BUILD}"
          echo "prerelease_tag=$PRERELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Pre-release version: $PRERELEASE_TAG"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: OpenBoatUtilsRealistic
        run: ./gradlew chiseledBuild

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('TimingSystem/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build plugin
        working-directory: TimingSystem
        run: mvn package -DskipTests -q

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/mod artifacts/plugin
          find OpenBoatUtilsRealistic/versions/*/build/libs/ -name "*.jar" ! -name "*-sources.jar" -exec cp {} artifacts/mod/ \;
          cp TimingSystem/target/TimingSystem-*.jar artifacts/plugin/

      - name: Create pre-release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.prerelease_tag }}"
          git push origin "${{ steps.version.outputs.prerelease_tag }}"

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.prerelease_tag }}
          name: OBU Realistic ${{ steps.version.outputs.prerelease_tag }} (Pre-release)
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/mod/*.jar
            artifacts/plugin/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
