name: Pre-release on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  prerelease:
    name: Build and Pre-release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Determine pre-release version
        id: version
        run: |
          # Find the latest full release tag (vX.X.X format) from git history
          LATEST_RELEASE=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)

          if [ -z "$LATEST_RELEASE" ]; then
            echo "ERROR: No full release tag found (vX.X.X format)"
            exit 1
          fi

          # Extract version number without 'v' prefix
          REALISTIC_VERSION="${LATEST_RELEASE#v}"
          echo "realistic_version=$REALISTIC_VERSION" >> "$GITHUB_OUTPUT"
          echo "Base release version: $REALISTIC_VERSION (from tag $LATEST_RELEASE)"

          # Find the latest pre-release tag for this version (e.g. v1.0.6.3)
          LATEST_PRERELEASE=$(git tag -l "v${REALISTIC_VERSION}.*" --sort=-version:refname | head -n 1)

          if [ -z "$LATEST_PRERELEASE" ]; then
            # No pre-release tags yet, start from .1
            NEXT_BUILD=1
          else
            # Extract the build number (4th segment) and increment
            ESCAPED_VERSION=$(echo "$REALISTIC_VERSION" | sed 's/\./\\./g')
            CURRENT_BUILD=$(echo "$LATEST_PRERELEASE" | sed "s/v${ESCAPED_VERSION}\.\([0-9]*\)/\1/")
            NEXT_BUILD=$((CURRENT_BUILD + 1))
          fi

          PRERELEASE_TAG="v${REALISTIC_VERSION}.${NEXT_BUILD}"
          PRERELEASE_VERSION="${REALISTIC_VERSION}.${NEXT_BUILD}"
          echo "prerelease_tag=$PRERELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease_version=$PRERELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Pre-release version: $PRERELEASE_TAG"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod with version from tag
        working-directory: IBRealistic
        run: ./gradlew chiseledBuild -Prealistic_version_override=${{ steps.version.outputs.prerelease_version }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('TimingSystem/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Set plugin version from tag
        working-directory: TimingSystem
        run: |
          VERSION="${{ steps.version.outputs.prerelease_version }}"
          TS_BASE=$(sed -n 's/.*<ts.base.version>\([^<]*\)<\/ts.base.version>.*/\1/p' pom.xml)
          # Update <realistic.version> property
          sed -i "s|<realistic.version>[^<]*</realistic.version>|<realistic.version>${VERSION}</realistic.version>|" pom.xml
          # Update <version> tag (first occurrence after <artifactId>TimingSystem</artifactId>)
          sed -i "s|<version>${TS_BASE}-[^<]*</version>|<version>${TS_BASE}-${VERSION}</version>|" pom.xml
          echo "Updated pom.xml to version ${TS_BASE}-${VERSION}"
          grep '<version>' pom.xml | head -1
          grep '<realistic.version>' pom.xml

      - name: Build plugin
        working-directory: TimingSystem
        run: mvn package -DskipTests -q

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/mod artifacts/plugin
          find IBRealistic/versions/*/build/libs/ -name "*.jar" ! -name "*-sources.jar" -exec cp {} artifacts/mod/ \;
          cp TimingSystem/target/TimingSystem-*.jar artifacts/plugin/

      - name: Build cumulative valid_hashes.txt
        run: |
          # Download previous valid_hashes.txt from latest release (if exists)
          PREV_HASHES=$(gh release list --limit 20 --json tagName,assets -q '
            [.[] | select(.assets[]?.name == "valid_hashes.txt")] | first | .tagName // empty
          ' 2>/dev/null || true)

          if [ -n "$PREV_HASHES" ]; then
            echo "Downloading previous valid_hashes.txt from release $PREV_HASHES"
            gh release download "$PREV_HASHES" --pattern "valid_hashes.txt" --dir . 2>/dev/null || true
          fi

          # Start with previous hashes or create new file
          if [ -f valid_hashes.txt ]; then
            echo "Loaded previous hashes:"
            cat valid_hashes.txt
          else
            echo "# IBRealistic valid build hashes" > valid_hashes.txt
            echo "# Place this file in plugins/TimingSystem/valid_hashes.txt" >> valid_hashes.txt
          fi

          # Append new hashes (skip duplicates)
          echo "" >> valid_hashes.txt
          echo "# Pre-release ${{ steps.version.outputs.prerelease_version }}" >> valid_hashes.txt
          for jar in artifacts/mod/*.jar; do
            NAME=$(basename "$jar")
            HASH=$(sha256sum "$jar" | cut -d' ' -f1)
            if ! grep -q "$HASH" valid_hashes.txt 2>/dev/null; then
              echo "$HASH" >> valid_hashes.txt
            fi
            echo "Hash for $NAME: $HASH"
          done

          echo "Final valid_hashes.txt:"
          cat valid_hashes.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pre-release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.prerelease_tag }}"
          git push origin "${{ steps.version.outputs.prerelease_tag }}"

      - name: Generate hash summary
        run: |
          echo "### Build Hashes (SHA-256)" > hash_summary.md
          echo '```' >> hash_summary.md
          for jar in artifacts/mod/*.jar; do
            NAME=$(basename "$jar")
            HASH=$(sha256sum "$jar" | cut -d' ' -f1)
            echo "$HASH  $NAME" >> hash_summary.md
          done
          echo '```' >> hash_summary.md
          echo "" >> hash_summary.md
          echo "Download \`valid_hashes.txt\` and place it in \`plugins/TimingSystem/valid_hashes.txt\`" >> hash_summary.md

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.prerelease_tag }}
          name: IBRealistic ${{ steps.version.outputs.prerelease_tag }} (Pre-release)
          prerelease: true
          generate_release_notes: true
          body_path: hash_summary.md
          append_body: true
          files: |
            artifacts/mod/*.jar
            artifacts/plugin/*.jar
            valid_hashes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
