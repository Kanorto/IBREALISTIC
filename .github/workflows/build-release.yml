name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mod:
    name: Build OpenBoatUtilsRealistic Mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: OpenBoatUtilsRealistic
        run: ./gradlew chiseledBuild

      - name: Upload mod artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openboatutils-mod
          path: |
            OpenBoatUtilsRealistic/versions/*/build/libs/*.jar
            !OpenBoatUtilsRealistic/versions/*/build/libs/*-sources.jar
          if-no-files-found: warn

  build-plugin:
    name: Build TimingSystem Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('TimingSystem/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build plugin
        working-directory: TimingSystem
        run: mvn package -DskipTests -q

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: timingsystem-plugin
          path: TimingSystem/target/TimingSystem-*.jar
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    needs: [build-mod, build-plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download mod artifacts
        uses: actions/download-artifact@v4
        with:
          name: openboatutils-mod
          path: artifacts/mod

      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          name: timingsystem-plugin
          path: artifacts/plugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OBU Realistic ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/mod/**/*.jar
            artifacts/plugin/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
