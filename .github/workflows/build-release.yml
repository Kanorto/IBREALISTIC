name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check-tag:
    name: Check tag format
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      realistic_version: ${{ steps.check.outputs.realistic_version }}
    steps:
      - name: Check if tag is a full release (vX.X.X)
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "realistic_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "Release version: ${BASH_REMATCH[1]}"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  build-mod:
    name: Build IBRealistic Mod
    needs: check-tag
    if: needs.check-tag.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build OpenBoatUtils dependency
        working-directory: OpenBoatUtils-main
        run: ./gradlew chiseledBuild

      - name: Copy OBU JARs to IBRealistic libs
        run: |
          mkdir -p IBRealistic/libs
          for dir in OpenBoatUtils-main/versions/*/build/libs; do
            for jar in "$dir"/OpenBoatUtils-*.jar; do
              [ -f "$jar" ] && [[ "$jar" != *-sources.jar ]] && cp "$jar" IBRealistic/libs/
            done
          done
          echo "OBU JARs copied:"
          ls -la IBRealistic/libs/

      - name: Build mod with version from tag
        working-directory: IBRealistic
        run: ./gradlew chiseledBuild -Prealistic_version_override=${{ needs.check-tag.outputs.realistic_version }}

      - name: Upload mod artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ibrealistic-mod
          path: |
            IBRealistic/versions/*/build/libs/*.jar
            !IBRealistic/versions/*/build/libs/*-sources.jar
          if-no-files-found: warn

  build-plugin:
    name: Build TimingSystem Plugin
    needs: [check-tag]
    if: needs.check-tag.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('TimingSystem/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Set plugin version from tag
        working-directory: TimingSystem
        run: |
          VERSION="${{ needs.check-tag.outputs.realistic_version }}"
          TS_BASE=$(sed -n 's/.*<ts.base.version>\([^<]*\)<\/ts.base.version>.*/\1/p' pom.xml)
          # Update <realistic.version> property
          sed -i "s|<realistic.version>[^<]*</realistic.version>|<realistic.version>${VERSION}</realistic.version>|" pom.xml
          # Update <version> tag (first occurrence after <artifactId>TimingSystem</artifactId>)
          sed -i "s|<version>${TS_BASE}-[^<]*</version>|<version>${TS_BASE}-${VERSION}</version>|" pom.xml
          echo "Updated pom.xml to version ${TS_BASE}-${VERSION}"
          grep '<version>' pom.xml | head -1
          grep '<realistic.version>' pom.xml

      - name: Build plugin
        working-directory: TimingSystem
        run: mvn package -DskipTests -q

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: timingsystem-plugin
          path: TimingSystem/target/TimingSystem-*.jar
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    needs: [check-tag, build-mod, build-plugin]
    if: needs.check-tag.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download mod artifacts
        uses: actions/download-artifact@v4.1.7
        with:
          name: ibrealistic-mod
          path: artifacts/mod

      - name: Download plugin artifacts
        uses: actions/download-artifact@v4.1.7
        with:
          name: timingsystem-plugin
          path: artifacts/plugin

      - name: Build cumulative valid_hashes.txt
        run: |
          # Download previous valid_hashes.txt from latest release (if exists)
          PREV_HASHES=$(gh release list --limit 20 --json tagName,assets -q '
            [.[] | select(.assets[]?.name == "valid_hashes.txt")] | first | .tagName // empty
          ' 2>/dev/null || true)

          if [ -n "$PREV_HASHES" ]; then
            echo "Downloading previous valid_hashes.txt from release $PREV_HASHES"
            gh release download "$PREV_HASHES" --pattern "valid_hashes.txt" --dir . 2>/dev/null || true
          fi

          # Start with previous hashes or create new file
          if [ -f valid_hashes.txt ]; then
            echo "Loaded previous hashes:"
            cat valid_hashes.txt
          else
            echo "# IBRealistic valid build hashes" > valid_hashes.txt
            echo "# Place this file in plugins/TimingSystem/valid_hashes.txt" >> valid_hashes.txt
          fi

          # Append new hashes (skip duplicates)
          echo "" >> valid_hashes.txt
          echo "# Release ${{ needs.check-tag.outputs.realistic_version }}" >> valid_hashes.txt
          for jar in artifacts/mod/**/*.jar; do
            NAME=$(basename "$jar")
            HASH=$(sha256sum "$jar" | cut -d' ' -f1)
            if ! grep -q "$HASH" valid_hashes.txt 2>/dev/null; then
              echo "$HASH" >> valid_hashes.txt
            fi
            echo "Hash for $NAME: $HASH"
          done

          echo "Final valid_hashes.txt:"
          cat valid_hashes.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate hash summary
        run: |
          echo "### Build Hashes (SHA-256)" > hash_summary.md
          echo '```' >> hash_summary.md
          for jar in artifacts/mod/**/*.jar; do
            NAME=$(basename "$jar")
            HASH=$(sha256sum "$jar" | cut -d' ' -f1)
            echo "$HASH  $NAME" >> hash_summary.md
          done
          echo '```' >> hash_summary.md
          echo "" >> hash_summary.md
          echo "Download \`valid_hashes.txt\` and place it in \`plugins/TimingSystem/valid_hashes.txt\`" >> hash_summary.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: IBRealistic ${{ github.ref_name }}
          generate_release_notes: true
          body_path: hash_summary.md
          append_body: true
          files: |
            artifacts/mod/**/*.jar
            artifacts/plugin/*.jar
            valid_hashes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
